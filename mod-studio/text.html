<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Text your MOD</title>
<style>
  :root {
    --bg: #F6F4F1; --card: #FFFFFF; --ink: #111111; --ink-2: #4A4A4A; --muted: #707070;
    --line: #E4E0DA; --red: #DE3341; --red-ink: #FFFFFF; --ok: #1E7F4F;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1C1C1C; --ink: #F4F2EF; --ink-2: #CFCAC4; --muted: #9A958F; --line: #2E2B28; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin: 0 0 6px; }
  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; }
  .num { font-size: 22px; font-weight: 700; letter-spacing: .01em; margin: 14px 0 18px; font-variant-numeric: tabular-nums; }
  .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 999px; font-size: 17px; font-weight: 700; text-decoration: none; border: 2px solid var(--red); cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--red); color: var(--red-ink); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); margin-top: 10px; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; font-size: 15px; padding: 12px 14px; }
  p.note { color: var(--muted); font-size: 13.5px; margin: 16px 0 0; }
  .err h1 { color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div id="ok" hidden>
    <p class="eyebrow">Weekend Manager on Duty</p>
    <h1 id="title">Text your MOD</h1>
    <div class="num" id="num"></div>
    <a class="btn btn-primary" id="go" href="#">Open Messages</a>
    <div class="row">
      <a class="btn btn-ghost" id="call" href="#">Call instead</a>
      <button class="btn btn-ghost" id="copy" type="button">Copy number</button>
    </div>
    <p class="note" id="note">If Messages didn’t open on its own, tap the red button.</p>
  </div>
  <div id="bad" class="err" hidden>
    <p class="eyebrow">Weekend Manager on Duty</p>
    <h1>This text link is missing a phone number</h1>
    <p class="note">Open the MOD email again and use the number shown under the manager’s name.</p>
  </div>
</main>
<script>
(function () {
  // Gmail removes sms: links from emails, so the MOD email links here instead.
  // Only digits are read from the URL, and the only places this page sends anyone are sms: and tel: for that number.
  var q = new URLSearchParams(location.search);
  var d = (q.get('to') || '').replace(/\D/g, '');
  if (d.length === 10) d = '1' + d;
  var $ = function (id) { return document.getElementById(id); };
  if (d.length < 11 || d.length > 15) { $('bad').hidden = false; document.title = 'Text link problem'; return; }

  var name = (q.get('n') || '').replace(/[^\p{L}\p{M} .'-]/gu, '').trim().slice(0, 40);
  var sms = 'sms:+' + d;
  var tel = 'tel:+' + d;
  var pretty = d.length === 11 && d[0] === '1'
    ? '(' + d.slice(1, 4) + ') ' + d.slice(4, 7) + '-' + d.slice(7)
    : '+' + d;

  $('ok').hidden = false;
  $('title').textContent = name ? 'Text ' + name : 'Text your MOD';
  document.title = name ? 'Text ' + name : 'Text your MOD';
  $('num').textContent = pretty;
  $('go').href = sms;
  $('go').textContent = name ? 'Text ' + name : 'Open Messages';
  $('call').href = tel;

  $('copy').addEventListener('click', function () {
    var done = function () { $('copy').textContent = 'Copied'; setTimeout(function () { $('copy').textContent = 'Copy number'; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pretty).then(done, function () {});
  });

  // On a phone, open Messages right away. On a computer, wait for a tap instead of popping an app dialog.
  var phone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  if (phone) {
    setTimeout(function () { location.href = sms; }, 60);
  } else {
    $('note').textContent = 'On a computer? Text this number from your phone, or tap the button if your computer can send texts.';
  }
})();
</script>
</body>
</html>
