<title>Weekend MOD Studio</title>
<meta name="description" content="Build, brand and send the weekend Manager on Duty email for Redfin Powered by Rocket.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a workbench. Left rail of numbered build steps, right a live inbox preview pinned in view. */
:root{
  --red:#DE3341; --red-deep:#B9232F; --red-tint:#FDECEE; --red-ink:#B9232F;
  --ink:#151417; --ink-2:#3D3A40; --muted:#6C6870; --line:#E8E4E6; --line-2:#D8D3D6;
  --bg:#F5F2F2; --surface:#FFFFFF; --surface-2:#FAF8F8; --surface-3:#F1EDEE;
  --ok:#1E8556; --ok-tint:#E5F4EC; --warn:#A8670F; --warn-tint:#FFF3DC;
  --shadow:0 1px 2px rgba(40,10,15,.05),0 10px 30px -12px rgba(40,10,15,.14);
  --shadow-lg:0 30px 80px -20px rgba(40,10,15,.35);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:10px;
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#FF4F5E; --red-deep:#DE3341; --red-tint:#3A181D; --red-ink:#FF8C96;
  --ink:#F5F2F3; --ink-2:#D9D3D6; --muted:#A39CA2; --line:#2C282C; --line-2:#3A353A;
  --bg:#0F0D0F; --surface:#181619; --surface-2:#1D1B1F; --surface-3:#242126;
  --ok:#4CC28A; --ok-tint:#17291F; --warn:#F0B451; --warn-tint:#2D2312;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  --logo-light:none; --logo-dark:block; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --red:#FF4F5E; --red-deep:#DE3341; --red-tint:#3A181D; --red-ink:#FF8C96;
  --ink:#F5F2F3; --ink-2:#D9D3D6; --muted:#A39CA2; --line:#2C282C; --line-2:#3A353A;
  --bg:#0F0D0F; --surface:#181619; --surface-2:#1D1B1F; --surface-3:#242126;
  --ok:#4CC28A; --ok-tint:#17291F; --warn:#F0B451; --warn-tint:#2D2312;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  --logo-light:none; --logo-dark:block; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-ink)}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,2.4vw,32px);padding-block:0 64px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{height:34px;width:auto}
.brand .logo-light{display:var(--logo-light)} .brand .logo-dark{display:var(--logo-dark)}
.brand-sep{width:1px;height:28px;background:var(--line-2)}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-name small{display:block;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-3);border-radius:999px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--warn-tint);color:var(--warn);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;font-size:13px;min-width:0}
.who>span:not(.role):not(.chip){max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.who>span:not(.role):not(.chip){display:none}}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.role{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--red-tint);color:var(--red-ink)}
.banner{margin:14px 0 0;padding:12px 16px;border-radius:var(--r-sm);background:var(--warn-tint);color:var(--ink);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--warn)}

/* Build hero */
.build-hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:30px 0 22px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);display:flex;align-items:center;gap:8px}
.live{position:relative;width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin-left:5px}
.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.build-hero h1{font-size:clamp(30px,4.2vw,50px);font-weight:900;line-height:1.02;letter-spacing:-.035em;margin-top:8px}
.build-hero h1 em{font-style:normal;color:var(--red)}
.build-hero p{color:var(--muted);margin-top:8px;max-width:60ch}
.progress{min-width:min(100%,300px);display:grid;gap:8px}
.progress-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red));border-radius:inherit;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress-chips{display:flex;gap:6px;flex-wrap:wrap}

/* Build grid */
.build-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:1080px){.build-grid{grid-template-columns:minmax(380px,470px) minmax(0,1fr)}}
.steps{display:grid;gap:14px;min-width:0}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.step:nth-child(2){animation-delay:.04s}.step:nth-child(3){animation-delay:.08s}.step:nth-child(4){animation-delay:.12s}.step:nth-child(5){animation-delay:.16s}.step:nth-child(6){animation-delay:.2s}.step:nth-child(7){animation-delay:.24s}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.step-head{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.step-num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500;background:var(--surface-3);color:var(--ink-2);flex:none;transition:background .3s,color .3s}
.step.is-done .step-num{background:var(--red);color:#fff}
.step-head h3{font-size:16px;font-weight:800}
.step-head .hint{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.step-body{padding:14px 18px 18px;display:grid;gap:12px;min-width:0}

/* Forms */
.field{display:grid;gap:6px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.field small{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.input,.select,.textarea{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;transition:border-color .2s,box-shadow .2s,background .2s}
.textarea{min-height:84px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 20px -10px var(--red)}
.btn-primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px}
.btn-danger{color:#C4202E;border-color:color-mix(in srgb,#C4202E 35%,var(--line-2))}
.btn-danger.is-armed{background:#C4202E;border-color:#C4202E;color:#fff}
.btn-lg{padding:13px 22px;font-size:15px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.red{background:var(--red-tint);color:var(--red-ink)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip-btn{cursor:pointer;border:1px solid var(--line-2);background:var(--surface)}
.chip-btn:hover{border-color:var(--red)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row b{font-size:14px;font-weight:700}
.switch-row small{display:block;color:var(--muted);font-size:12px}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch:checked{background:var(--red)}
.switch:checked::after{transform:translateX(18px)}
.range{width:100%;accent-color:var(--red)}

/* Pickers */
.mgr-list{display:flex;gap:8px;flex-wrap:wrap}
.mgr{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:13px;transition:border-color .2s,box-shadow .2s}
.mgr img,.mgr .ini{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.ini{display:grid;place-items:center;background:var(--red-tint);color:var(--red-ink);font-size:11px;font-weight:800}
.mgr.is-active{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 16%,transparent)}
.hs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.hs{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid transparent;cursor:pointer;padding:0;background:var(--surface-3);transition:transform .2s,border-color .2s}
.hs img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.hs:hover{transform:scale(1.04)}
.hs.is-active{border-color:var(--red)}
.hs .tick{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;display:none;place-items:center;font-weight:900}
.hs.is-active .tick{display:grid}
.add-tile{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;background:transparent;text-align:center;line-height:1.2;padding:6px}
.add-tile:hover{border-color:var(--red);color:var(--red-ink)}
.crop-box{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.crop-box canvas{width:96px;height:96px;border-radius:50%;background:var(--surface-3)}
.sp-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sp-opt{position:relative;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;display:flex;flex-direction:column;transition:border-color .2s,transform .2s,box-shadow .2s}
.sp-opt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sp-opt .thumb{aspect-ratio:3/2;background:var(--surface-3) center/cover no-repeat}
.sp-opt .t{padding:8px 10px 10px;font-size:13px;font-weight:700;line-height:1.3}
.sp-opt .t small{display:block;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.sp-opt .badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--red);color:#fff;display:none}
.sp-opt.is-featured{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 16%,transparent)}
.sp-opt.is-featured .badge,.sp-opt.is-extra .badge{display:block}
.sp-opt.is-extra{border-color:var(--ink-2)}
.sp-opt.is-extra .badge{background:var(--ink);color:var(--bg)}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.style-opt{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:8px;cursor:pointer;text-align:left;display:grid;gap:8px;transition:border-color .2s,transform .2s}
.style-opt:hover{transform:translateY(-2px)}
.style-opt.is-active{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 16%,transparent)}
.mini{height:92px;border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;padding:6px;gap:5px}
.mini .h{border-radius:5px;height:40px;display:flex;align-items:center;gap:5px;padding:0 6px}
.mini .h i{width:16px;height:16px;border-radius:50%;flex:none}
.mini .h b{height:5px;border-radius:3px;flex:1;opacity:.85}
.mini .c{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mini .c span{border-radius:4px}
.style-opt strong{font-size:13px}
.style-opt small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.send-panel{display:grid;gap:12px}
.checklist{display:grid;gap:6px;font-size:13px}
.checklist div{display:flex;gap:8px;align-items:flex-start}
.checklist .ok{color:var(--ok);font-weight:900}
.checklist .no{color:var(--warn);font-weight:900}
.howto{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.howto ol{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}

/* Preview */
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);min-width:0}
.preview-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pv-dots{display:flex;gap:5px}.pv-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.pv-meta{min-width:0;flex:1;font-size:12.5px;line-height:1.3}
.pv-meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-meta span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3);gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.seg button.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pv-stage{height:clamp(560px,calc(100vh - 190px),1500px);background:var(--surface-3);display:flex;justify-content:center;padding:0;position:relative}
.pv-stage iframe{border:0;width:100%;height:100%;background:#fff;transition:opacity .25s}
.pv-stage.phone{padding:18px 0}
.pv-stage.phone iframe{width:390px;max-width:calc(100% - 24px);border-radius:34px;border:9px solid #141214;box-shadow:var(--shadow-lg)}
.pv-stage.is-updating iframe{opacity:.55}
.pv-note{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}

/* Library + core + brand */
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:30px 0 18px}
.page-head h2{font-size:clamp(26px,3.2vw,38px);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.page-head p{color:var(--muted);margin-top:6px;max-width:68ch}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtab{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.subtab.is-active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lib-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.lib-card .img{aspect-ratio:3/2;background:var(--surface-3) center/cover no-repeat;position:relative}
.lib-card .img .chip{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--surface) 92%,transparent)}
.lib-card .body{padding:14px 16px;display:grid;gap:6px;flex:1;align-content:start}
.lib-card h4{font-size:16px;font-weight:800;line-height:1.25}
.lib-card p{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lib-card .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 16px 14px;border-top:1px solid var(--line)}
.lib-card .foot .by{font-size:12px;color:var(--muted);margin-right:auto}
.empty{border:2px dashed var(--line-2);border-radius:16px;padding:34px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.mgr-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.mgr-block-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mgr-block-head .ini,.mgr-block-head img{width:44px;height:44px;border-radius:50%;object-fit:cover;font-size:14px}
.mgr-block-head h4{font-size:16px;font-weight:800}
.mgr-block-head .meta{font-size:13px;color:var(--muted)}
.hs-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.hs-card{display:grid;gap:6px;font-size:12px;min-width:0}
.hs-card .ph{aspect-ratio:4/5;border-radius:12px;background:var(--surface-3) 50% 25%/cover no-repeat;position:relative}
.hs-card.is-default .ph{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--red)}
.hs-card .ph .chip{position:absolute;left:6px;top:6px;font-size:10px;padding:2px 7px}

<script>
(() => {
'use strict';

/* ---------------- utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = (s) => esc(s).replace(/\n/g, '<br>');
const digits = (s) => String(s || '').replace(/\D/g, '');
const e164 = (p) => { let d = digits(p); if (d.length === 10) d = '1' + d; return d.length >= 11 ? '+' + d : ''; };
const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || '';
const initials = (n) => String(n || '').trim().split(/\s+/).map((p) => p[0] || '').slice(0, 2).join('').toUpperCase() || '?';
const slug = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-').slice(0, 48) || 'item';
const rid = () => Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const abs = (p) => new URL(p, document.baseURI).href;
const assetURL = (id) => '/_blob/' + id;
const byOrder = (a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.title || '').localeCompare(String(b.title || ''));
const byListOrder = (a, b) => (a.order ?? 999) - (b.order ?? 999) || String(a.name || a.email || '').localeCompare(String(b.name || b.email || ''));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function safeHref(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^(https?:|mailto:|tel:|sms:)/i.test(u)) return u;
  if (/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(u)) return 'mailto:' + u;
  if (/^\+?[\d\s().-]{10,}$/.test(u) && e164(u)) return 'tel:' + e164(u);
  if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u)) return 'https://' + u;
  return '';
}
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map((m) => m.slice(0, 3));
function nextSaturday(from = new Date()) { const d = new Date(from.getFullYear(), from.getMonth(), from.getDate()); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7)); return d; }
function isoDay(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function parseDay(iso) { const [y, m, d] = String(iso || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : nextSaturday(); }
function weekend(iso) {
  const sat = parseDay(iso); const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
  const same = sat.getMonth() === sun.getMonth();
  return {
    sat, sun,
    long: same ? `${MONTHS[sat.getMonth()]} ${sat.getDate()}–${sun.getDate()}, ${sun.getFullYear()}` : `${MONTHS[sat.getMonth()]} ${sat.getDate()} – ${MONTHS[sun.getMonth()]} ${sun.getDate()}, ${sun.getFullYear()}`,
    short: same ? `${MON[sat.getMonth()]} ${sat.getDate()}–${sun.getDate()}` : `${MON[sat.getMonth()]} ${sat.getDate()}–${MON[sun.getMonth()]} ${sun.getDate()}`,
    pill: `Sat ${MON[sat.getMonth()]} ${sat.getDate()} · Sun ${MON[sun.getMonth()]} ${sun.getDate()}`,
  };
}
function fmtHour(h) {
  h = Number(h); const hh = Math.floor(h); const mm = Math.round((h - hh) * 60);
  const ap = hh >= 12 && hh < 24 ? 'PM' : 'AM'; let h12 = hh % 12; if (h12 === 0) h12 = 12;
  return mm ? `${h12}:${String(mm).padStart(2, '0')} ${ap}` : `${h12} ${ap}`;
}
function fmtWhen(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : ''); el.textContent = msg;

}
function errMsg(e) {
  switch (e && e.code) {
    case 'invalid_argument': return 'That change was refused. You may need Editor access to this Studio.';

  const tiles = secs.map((c) => {
    const lines = (c.lines || []).slice(0, 2).map((l, i) => `<div style="margin-top:${i ? 6 : 8}px">${l.label ? `<div style="${ff(SANS, 11.5, 600, 1.3, `color:${s.muted}`)}">${esc(l.label)}</div>` : ''}<div style="${ff(SANS, i ? 13.5 : 14.5, 400, 1.35, `color:${s.ink};word-break:break-word`)}">${elink(l.href || l.value, l.value, s.ink, i ? 600 : 700)}</div></div>`).join('');
    return `<table ${TBL} width="100%" bgcolor="${s.tile}" style="background:${s.tile};border-radius:${Math.max(0, s.radius - 6)}px;${s.tileBorder ? `border:${s.tileBorder};` : ''}border-collapse:separate"><tr><td style="padding:16px 16px 15px">
      <div style="${ff(s.eyebrowFont || SANS, 11, 800, 1.3, `letter-spacing:1.4px;text-transform:uppercase;color:${s.accent}`)}">${esc(c.kicker || '')}</div>
      <div style="${ff(SANS, 16, 800, 1.3, `color:${s.ink};margin-top:3px`)}">${esc(c.title)}</div>${lines}
      ${c.hoursText ? `<div style="${ff(SANS, 12, 400, 1.4, `color:${s.muted};margin-top:8px`)}">${esc(c.hoursText)}</div>` : ''}

  return ecard(s, ehead(s, 'Need help now?', 'Tap to reach the right team') + ecols(tiles, 295));

  if (tk.length) {

    h += pr.map((p) => `<div style="background:${s.tint};border-left:3px solid ${s.accent};border-radius:${Math.min(8, s.radius)}px;padding:11px 14px;margin:0 0 8px;${ff(SANS, 15, 500, 1.45, `color:${s.ink}`)}">“${esc(p.replace(/^["“”]+|["“”]+$/g, ''))}”</div>`).join('');

  }
  const more = rest.filter(Boolean);
  if (more.length) {
    h += `${spacer(14)}<div style="border-top:1px solid ${s.line};padding-top:16px;${ff(SANS, 12, 800, 1.4, `letter-spacing:1.3px;text-transform:uppercase;color:${s.muted}`)}">Also on our radar</div>`;

function eCoverage(m, s) {
  const AX0 = 6, AX1 = 21;
  const entries = [];
  const mg = m.manager;
  if (mg.availStart !== '' && mg.availEnd !== '' && Number(mg.availEnd) > Number(mg.availStart)) entries.push({ days: ['sat', 'sun'], start: Number(mg.availStart), end: Number(mg.availEnd), label: `${firstName(mg.name) || 'Your MOD'} (MOD)`, mod: true });
  m.core.filter((c) => c.visible !== false).forEach((c) => (c.coverage || []).forEach((cv) => { if (Number(cv.end) > Number(cv.start)) entries.push({ ...cv, start: Number(cv.start), end: Number(cv.end), label: cv.label || c.kicker || c.title }); }));
  if (!entries.length) return '';
  const total = AX1 - AX0;
  const bar = (r) => {
    const a = clamp(r.start, AX0, AX1), b = clamp(r.end, AX0, AX1);
    const left = ((a - AX0) / total) * 100, w = Math.max(3, ((b - a) / total) * 100), right = Math.max(0, 100 - left - w);
    const color = r.mod ? s.ink : s.accent;
    return `<table ${TBL} width="100%"><tr><td style="${ff(SANS, 13, 700, 1.3, `color:${s.ink}`)}">${esc(r.label)}</td><td align="right" style="${ff(SANS, 12, 400, 1.3, `color:${s.muted};white-space:nowrap`)}">${fmtHour(r.start)}–${fmtHour(r.end)}</td></tr></table>
      <table ${TBL} width="100%" bgcolor="${s.track}" style="background:${s.track};border-radius:6px;margin:5px 0 13px;border-collapse:separate"><tr>${left > 0.5 ? `<td width="${left.toFixed(1)}%" style="height:10px;font-size:0;line-height:0">&nbsp;</td>` : ''}<td width="${w.toFixed(1)}%" bgcolor="${color}" style="background:${color};border-radius:6px;height:10px;font-size:0;line-height:0">&nbsp;</td>${right > 0.5 ? `<td width="${right.toFixed(1)}%" style="font-size:0;line-height:0">&nbsp;</td>` : ''}</tr></table>`;
  };
  const axis = `<table ${TBL} width="100%"><tr>${['6a', '9a', '12p', '3p', '6p'].map((t) => `<td width="20%" style="border-left:1px solid ${s.line};padding-left:4px;${ff(SANS, 10.5, 600, 1.2, `color:${s.muted}`)}">${t}</td>`).join('')}</tr></table>`;
  const day = (key, label) => {
    const rows = entries.filter((e) => (e.days || []).includes(key));
    if (!rows.length) return '';
    return `<div style="${ff(SANS, 15, 800, 1.3, `color:${s.ink};margin:0 0 10px`)}">${label}</div>${rows.map(bar).join('')}${axis}`;
  };
  return ecard(s, ehead(s, 'Weekend coverage', 'Who’s on, and when') + ecols([day('sat', `Saturday · ${MON[m.weekend.sat.getMonth()]} ${m.weekend.sat.getDate()}`), day('sun', `Sunday · ${MON[m.weekend.sun.getMonth()]} ${m.weekend.sun.getDate()}`)], 295, { gap: 6 }) +
    `<div style="${ff(SANS, 12, 400, 1.4, `color:${s.muted};margin-top:10px`)}">${esc(m.brand.tz)}</div>`);
}

function eRouting(m, s) {

const titleFromFile = (n) => { const t = String(n || 'Infographic').replace(/\.[a-z0-9]+$/i, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim(); return t ? t[0].toUpperCase() + t.slice(1) : 'Infographic'; };
async function bulkUpload(files) {
  files = Array.from(files || []).filter(isImageFile);
  if (!files.length) { toast('Pick image files: JPEG, PNG, WebP, GIF or HEIC.', 'err'); return; }
  if (!canUpload()) { toast(errMsg({ code: 'not_granted' }), 'err'); return; }
  const many = files.length > 1; const prog = progress(many ? `Uploading 1 of ${files.length}…` : 'Uploading graphic…');
  let ok = 0; let lastErr = null; let single = null;
  for (const [i, f] of files.entries()) {
    prog.set(many ? `Uploading ${i + 1} of ${files.length}…` : 'Uploading graphic…');
    try {
      const r = await uploadImage(f, 1800); const title = titleFromFile(f.name); const id = `${slug(title)}-${rid()}`;
      const data = { title, category: '', summary: '', takeaways: [], prompts: [], promptsLabel: '', ctaLabel: '', ctaUrl: '', publicUrl: '', assetId: r.id, createdBy: S.me.id || '', createdAt: nowISO(), updatedAt: nowISO() };
      await S.db.collection('spotlights').doc(id).set(data); single = { id, ...data }; ok += 1;
    } catch (e) { console.error(e); lastErr = e; }
  }
  prog.done();
  if (!ok) { toast(uploadErr(lastErr), 'err'); return; }
  S.spTrash = false; if (S.tab === 'library') { S.libTab = 'spotlights'; renderLibrary(); }
  if (!many && single) { S.editFallback = single; spotlightDrawer(single.id); toast('Saved to the bank. Add a title and takeaways now, or come back later.'); }
  else toast(`${ok} graphic${ok > 1 ? 's' : ''} saved to the bank. Add titles and takeaways anytime.`);
  if (lastErr) toast(`Some files didn’t upload. ${uploadErr(lastErr)}`, 'err');
}

async function saveSched(id, btn) {
  const date = id || ($('#s_date') ? $('#s_date').value : '');
  if (!date || parseDay(date).getDay() !== 6) { toast('Pick a Saturday.', 'err'); return; }
  const cur = schedFor(date); const mgrId = $('#s_mgr').value; const note = $('#s_note').value.trim(); const swapWith = $('#s_swap') ? $('#s_swap').value : '';
  const stamp = { updatedAt: nowISO(), updatedBy: S.me.id || '' };
  const orig = (e, next) => { const o = (e && (e.originalManagerId || e.managerId)) || ''; return o === next ? '' : o; };
  if (!id && cur) { toast(`${weekend(date).short} is already on the schedule. Edit it instead.`, 'err'); return; }
  await busy(btn, 'Saving…', async () => {
    let ok;
    if (cur && swapWith) {
      const other = schedFor(swapWith); if (!other) { toast('That weekend isn’t on the schedule.', 'err'); return; }
      ok = await write(async () => {
        await S.db.collection('schedule').doc(cur.id).update({ managerId: other.managerId, originalManagerId: orig(cur, other.managerId), note: note || `Swapped with ${firstName(schedName(cur))}`, ...stamp });
        await S.db.collection('schedule').doc(other.id).update({ managerId: cur.managerId, originalManagerId: orig(other, cur.managerId), note: `Swapped with ${firstName(schedName(other))}`, ...stamp });
      }, `Swapped: ${firstName(schedName(other))} has ${weekend(cur.id).short}, ${firstName(schedName(cur))} has ${weekend(other.id).short}.`);
    } else if (cur) {
      ok = await write(() => S.db.collection('schedule').doc(cur.id).update({ managerId: mgrId, originalManagerId: orig(cur, mgrId), note, ...stamp }), 'Schedule updated for everyone.');
    } else {
      ok = await write(() => S.db.collection('schedule').doc(date).set({ saturday: date, managerId: mgrId, originalManagerId: '', note, createdAt: nowISO(), createdBy: S.me.id || '', ...stamp }), `Added ${weekend(date).short}.`);
    }
    if (ok) closeDrawer();
  });
}
async function extendSched(btn) {
  const list = S.schedule.slice().sort((a, b) => a.id.localeCompare(b.id));
  if (list.length < 4) { toast('Add a few weekends first so there’s a rotation to continue.', 'err'); return; }
  const recent = list.slice(-20); const period = new Set(recent.map((x) => x.managerId)).size || 10;
  const map = new Map(list.map((x) => [x.id, x.managerId])); let last = list[list.length - 1].id; let n = 0;
  await busy(btn, 'Adding…', async () => {
    for (let k = 0; k < 13; k += 1) {
      const date = addDays(last, 7); const src = map.get(addDays(date, -7 * period)); if (!src) break;
      const ok = await write(() => S.db.collection('schedule').doc(date).set({ saturday: date, managerId: src, originalManagerId: '', note: '', createdAt: nowISO(), createdBy: S.me.id || '', updatedAt: nowISO(), updatedBy: S.me.id || '' }));
      if (!ok) break; map.set(date, src); last = date; n += 1;
    }
  });
  if (n) toast(`Added ${n} weekends through ${weekend(last).short}, following the ${period}-week rotation.`);
}
function schedMe(id) {
  const e = schedFor(id); if (!e) return; const mg = mgrById(e.managerId);

}

  'delete-manager': (a) => deleteManager(a.dataset.id, a),
  'pick-subject': (a) => { const i = Number(a.dataset.i); S.draft.subject = subjectOptions(S.draft)[i]; S.draft.subjectAuto = i === 0; const inp = $('#b_subject'); if (inp) inp.value = S.draft.subject; saveDraft(); schedulePreview(); refreshSendBits(); },
  'pick-headshot': (a) => { S.draft.headshotId = a.dataset.id; S.draft.crop = null; saveDraft(); renderHsPicker(); renderCropBox(); renderSendPanel(); updateProgress(); schedulePreview(); },
  'upload-headshot': (a) => headshotDrawer(null, a.dataset.manager),
  'edit-headshot': (a) => headshotDrawer(a.dataset.id),
  'save-headshot': (a) => saveHeadshot(a.dataset.id, a),
  'delete-headshot': (a) => deleteHeadshot(a.dataset.id, a),
  'default-headshot': (a) => { const h = S.headshots.find((x) => x.id === a.dataset.id); if (h) write(() => S.db.collection('managers').doc(h.managerId).update({ defaultHeadshotId: h.id }), 'Default photo updated.'); },
  'save-crop': (a) => { const d = S.draft; if (!d.crop || !d.headshotId) { toast('Adjust the sliders first.'); return; } const crop = { ...d.crop }; busy(a, 'Saving…', () => write(() => S.db.collection('headshots').doc(d.headshotId).update({ crop }), 'Crop saved for this photo.').then((ok) => { if (ok) { d.crop = null; saveDraft(); } })); },
  'reset-crop': () => { S.draft.crop = null; saveDraft(); drawCrop(true); schedulePreview(); },
  'toggle-spotlight': (a) => toggleSpotlight(a.dataset.id),
  'use-spotlight': (a) => useSpotlight(a.dataset.id),
  'new-spotlight': () => spotlightDrawer(null),
  'edit-spotlight': (a) => spotlightDrawer(a.dataset.id),
  'save-spotlight': (a) => saveSpotlight(a.dataset.id, a),
  'pick-style': (a) => { S.draft.style = a.dataset.style; S.draft.styleInit = true; saveDraft(); renderStylePick(); updateProgress(); schedulePreview(); },
  'copy-email': () => copyEmail(),
  'copy-subject': () => copySubject(),
  'copy-code': () => copyCode(),
  'download-html': (a) => downloadHtml(a),
  'save-history': (a) => saveHistory(a),
  'go-core': (a, e) => { e.preventDefault(); showTab('core'); },
  'go-brand': (a, e) => { e.preventDefault(); showTab('brand'); },
  'lib-tab': (a) => { S.libTab = a.dataset.tab; renderLibrary(); },
  'reuse-email': (a) => reuseEmail(a.dataset.id),
  'new-core': () => coreDrawer(null),
  'edit-core': (a) => coreDrawer(a.dataset.id),
  'save-core': (a) => saveCore(a.dataset.id, a),
  'delete-core': (a) => { if (armed(a)) write(() => S.db.collection('core').doc(a.dataset.id).delete(), 'Section deleted.').then((ok) => ok && closeDrawer()); },
  'move-core': (a) => moveCore(a.dataset.id, a.dataset.dir),
  'verify-core': (a) => write(() => S.db.collection('core').doc(a.dataset.id).update({ needsReview: false, lastVerified: nowISO(), verifiedBy: S.me.id || '' }), 'Marked verified.'),
  'rep-add': (a) => { const k = a.dataset.kind; const box = $(k === 'line' ? '#repLines' : k === 'step' ? '#repSteps' : '#repCov'); box.insertAdjacentHTML('beforeend', k === 'line' ? lineRow() : k === 'step' ? stepRow() : covRow()); const f = box.lastElementChild.querySelector('input,textarea'); if (f) f.focus(); },
  'rep-remove': (a) => { const it = a.closest('.rep-item'); if (it) it.remove(); },
  'suggest': (a) => suggestDrawer(a.dataset.id || ''),
  'save-suggestion': (a) => { const text = $('#s_text').value.trim(); if (!text) { toast('Describe the change first.', 'err'); return; } busy(a, 'Sending…', () => write(() => S.db.collection('suggestions').doc(`sg-${Date.now()}-${rid()}`).set({ sectionId: $('#s_sec').value, text, status: 'open', createdBy: S.me.id || '', createdAt: nowISO() }), `Sent to ${adminName()}.`).then((ok) => ok && closeDrawer())); },
  'resolve-sugg': (a) => write(() => S.db.collection('suggestions').doc(a.dataset.id).update({ status: 'done', resolvedAt: nowISO() }), 'Marked done.'),
  'upload-logo': (a) => { S.fileTarget = { kind: 'logo', key: a.dataset.key }; $('#filePick').click(); },
  'reset-logo': (a) => resetLogo(a.dataset.key),
  'save-brand': (a) => saveBrand(a),
  'pick-file': () => $('#filePick').click(),
  'replay': () => { S.replay = true; updatePreview(); },
  'launch-gmail': (a) => { a.href = gmailURL(); copyEmail({ launch: true }); },
  'copy-bcc': () => { const l = bccList(); if (!l.length) { toast('The BCC list is empty.', 'err'); return; } copyTextMsg(l.join(', '), `Copied ${l.length} BCC address${l.length === 1 ? '' : 'es'}.`); },
  'copy-bcc-all': () => { const l = S.distribution.filter((r) => r.active !== false).sort(byListOrder).map((r) => r.email).filter(Boolean); if (!l.length) { toast('The list is empty.', 'err'); return; } copyTextMsg(l.join(', '), `Copied ${l.length} address${l.length === 1 ? '' : 'es'}.`); },
  'toggle-bcc': () => { S.bccOpen = !S.bccOpen; renderSendPanel(); },
  'move-sec': (a) => moveSection(a.dataset.key, a.dataset.dir),
  'reset-order': () => { S.draft.order = DEFAULT_ORDER.slice(); saveDraft(); renderToggles(); schedulePreview(); toast('Back to the standard order.'); },
  'bulk-upload': () => $('#filePickMulti').click(),
  'sp-filter': (a) => { S.spTrash = a.dataset.trash === '1'; renderLibrary(); },
  'trash-spotlight': (a) => trashSpotlight(a.dataset.id).then((ok) => { if (ok && a.dataset.close) closeDrawer(); }),
  'restore-spotlight': (a) => write(() => S.db.collection('spotlights').doc(a.dataset.id).update({ trashedAt: null, trashedBy: null }), 'Restored to the bank.'),
  'purge-spotlight': (a) => purgeSpotlight(a.dataset.id, a),
  'new-recip': () => recipDrawer(null),
  'edit-recip': (a) => recipDrawer(a.dataset.id),
  'save-recip': (a) => saveRecip(a.dataset.id, a),
  'delete-recip': (a) => { if (armed(a)) write(() => S.db.collection('distribution').doc(a.dataset.id).delete(), 'Removed from the list.').then((ok) => ok && closeDrawer()); },
  'paste-recips': () => pasteDrawer(),
  'save-paste': (a) => savePaste(a),
  'sched-me': (a) => schedMe(a.dataset.id),
  'edit-sched': (a) => schedDrawer(a.dataset.id),
  'new-sched': () => schedDrawer(null),
  'save-sched': (a) => saveSched(a.dataset.id, a),
  'delete-sched': (a) => { if (armed(a)) write(() => S.db.collection('schedule').doc(a.dataset.id).delete(), 'Weekend removed.').then((ok) => ok && closeDrawer()); },
  'extend-sched': (a) => extendSched(a),
  'sched-all': () => { S.schedAll = !S.schedAll; renderSchedule(); },
};
async function copyTextMsg(text, msg) { let ok = false; try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = execCopyText(text); } toast(ok ? msg : 'Copy was blocked here. Select the text and copy it manually.', ok ? '' : 'err'); }
function bindGlobal() {
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab[data-tab]'); if (tab) { showTab(tab.dataset.tab); return; }
    const dev = e.target.closest('[data-device]');
    if (dev) { S.device = dev.dataset.device; $$('#pvDevice button').forEach((b) => b.classList.toggle('is-active', b === dev)); $('#pvStage').classList.toggle('phone', S.device === 'phone'); return; }
    const a = e.target.closest('[data-action]'); if (!a) return;
    const fn = handlers[a.dataset.action]; if (fn) fn(a, e);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#drawerWrap').hidden) closeDrawer();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'dz') { e.preventDefault(); $('#filePick').click(); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.bind) { setBind(t.dataset.bind, t.value); return; }
    if (t.id === 'p_text') { const { all, fresh } = pasteParsed(); const el = $('#p_preview'); if (el) el.textContent = all.length ? `Found ${all.length} address${all.length === 1 ? '' : 'es'}. ${fresh.length} new, ${all.length - fresh.length} already on the list.` : 'Nothing to add yet.'; return; }
    if (t.dataset && t.dataset.crop) {
      S.draft.crop = { zoom: Number($('#b_zoom').value), fy: Number($('#b_fy').value) };
      saveDraft(); drawCrop(false); schedulePreview();
    }
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches && t.matches('input[type=file][data-upload]')) { const files = Array.from(t.files || []); const o = { mgr: t.dataset.manager, key: t.dataset.key }; const kind = t.dataset.upload; t.value = ''; handleUpload(kind, files, o); return; }
    if (t.dataset && t.dataset.toggle) { S.draft.toggles[t.dataset.toggle] = t.checked; const li = t.closest('.sort-item'); if (li) li.classList.toggle('is-off', !t.checked); saveDraft(); schedulePreview(); updateProgress(); renderSendPanel(); }
    if (t.dataset && t.dataset.bccid) { const off = new Set(S.draft.bccOff || []); if (t.checked) off.delete(t.dataset.bccid); else off.add(t.dataset.bccid); S.draft.bccOff = [...off]; saveDraft(); refreshSendBits(); }
    if (t.id === 'schedMine') { S.schedMine = t.value; try { localStorage.setItem('modstudio.mine', t.value); } catch (err) { /* ignore */ } renderSchedule(); return; }
    if (t.dataset && t.dataset.recipActive) { const id = t.dataset.recipActive; write(() => S.db.collection('distribution').doc(id).update({ active: t.checked, updatedAt: nowISO() }), t.checked ? 'Back on the list.' : 'Paused. They won’t get the email until you turn this back on.'); }
  });
  $('#filePick').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; onFile(f); });
  $('#filePickMulti').addEventListener('change', (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; bulkUpload(fs); });
  document.addEventListener('dragover', (e) => { const dz = e.target.closest && e.target.closest('#dz'); if (dz) { e.preventDefault(); dz.classList.add('is-over'); } });
  document.addEventListener('dragleave', (e) => { const dz = e.target.closest && e.target.closest('#dz'); if (dz) dz.classList.remove('is-over'); });
  document.addEventListener('drop', (e) => { const dz = e.target.closest && e.target.closest('#dz'); if (dz) { e.preventDefault(); dz.classList.remove('is-over'); onFile(e.dataTransfer.files && e.dataTransfer.files[0]); } });
  document.addEventListener('paste', (e) => {
    if ($('#drawerWrap').hidden || !$('#dz')) return;
    const item = Array.from((e.clipboardData && e.clipboardData.items) || []).find((i) => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); onFile(item.getAsFile()); }
  });
}

/* ---------------- data ---------------- */
function subscribeAll() {
  const on = (coll, key, q = (x) => x) => {
    try {
      q(S.db.collection(coll)).onSnapshot((snap) => { S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.add(key); dataChanged(key); },
        (err) => { console.warn(coll, err); S.loaded.add(key); dataChanged(key); });
    } catch (e) { console.warn(coll, e); S.loaded.add(key); }
  };
  on('core', 'core'); on('managers', 'managers'); on('headshots', 'headshots'); on('spotlights', 'spotlights');
  on('emails', 'emails', (c) => c.orderBy('createdAt', 'desc').limit(60)); on('suggestions', 'suggestions'); on('brand', 'brandDocs'); on('distribution', 'distribution'); on('schedule', 'schedule');
}
function dataChanged(key) {
  if (key === 'brandDocs') {
    const d = S.brandDocs.find((x) => x.id === 'settings'); if (d) { const { id, ...rest } = d; S.brand = rest; } else S.brand = {};
    IMG.clear();
    if (!S.draft.styleInit) { S.draft.style = brandSettings().defaultStyle in STYLES ? brandSettings().defaultStyle : 'signature'; S.draft.styleInit = true; saveDraft(); renderStylePick(); }
  }
  pending.add(key); if (!raf) raf = requestAnimationFrame(flush);
}
let pending = new Set(); let raf = 0;
function flush() {
  raf = 0; const keys = pending; pending = new Set(); const d = S.draft;
  if (S.loaded.has('managers')) {
    if (d.managerId && !S.managers.some((m) => m.id === d.managerId)) { d.managerId = ''; saveDraft(); }
    if (!d.managerId && !d.manager.name && (S.loaded.has('schedule') || S.mode !== 'live')) {
      const se = schedFor(d.saturday);
      const mine = (se && mgrById(se.managerId)) || S.managers.find((m) => m.userId && m.userId === S.me.id) || (S.me.isOwner && S.managers.find((m) => m.ownerProfile)) || (S.managers.length === 1 ? S.managers[0] : null);
      if (mine) selectManager(mine.id);
    }
    if (d.managerId && !d.headshotId && S.loaded.has('headshots')) { const mg = S.managers.find((m) => m.id === d.managerId); const hs = mg && mgrHeadshot(mg); if (hs) { d.headshotId = hs.id; saveDraft(); } }
  }
  if (!d.spInit && S.loaded.has('spotlights') && liveSpotlights().length) {
    const newest = liveSpotlights().sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))[0];
    d.spotlightIds = [newest.id]; d.spInit = true; saveDraft();
  }
  d.spotlightIds = d.spotlightIds.filter((id) => !S.loaded.has('spotlights') || liveSpotlights().some((x) => x.id === id));
  const rc = $('#recipCount'); if (rc) rc.textContent = S.distribution.length ? String(S.distribution.filter((r) => r.active !== false).length) : '';
  if (keys.has('managers') || keys.has('headshots') || keys.has('schedule')) { renderMgrPicker(); renderHsPicker(); renderCropBox(); }
  if (keys.has('managers') && !$('#mgrFields').contains(document.activeElement)) renderMgrFields();
  if (keys.has('spotlights')) renderSpPicker();
  renderSendPanel(); updateProgress(); updateCoreBadge(); renderWho();
  if (S.tab !== 'build') renderView(S.tab);
  schedulePreview(); refreshPeople();
}
let peopleBusy = false;
async function refreshPeople() {
  if (!S.user || peopleBusy) return;
  const ids = new Set(); [S.spotlights, S.headshots, S.emails, S.suggestions].forEach((l) => l.forEach((x) => { if (x.createdBy) ids.add(x.createdBy); }));
  const missing = [...ids].filter((id) => !(id in S.people)); if (!missing.length) return;
  peopleBusy = true;
  try { const ps = await S.user.profiles(missing); missing.forEach((id) => { S.people[id] = ps[id] || { name: '' }; }); if (S.tab !== 'build') renderView(S.tab); }
  catch (e) { missing.forEach((id) => { S.people[id] = { name: '' }; }); }
  finally { peopleBusy = false; }
}

/* ---------------- boot ---------------- */
function afterMode() { renderWho(); renderBanner(); renderMgrPicker(); renderMgrFields(); renderHsPicker(); renderSpPicker(); renderSendPanel(); updateProgress(); if (S.tab !== 'build') renderView(S.tab); }
async function init() {
  const bar = $('.pv-bar'); const play = document.createElement('button'); play.className = 'btn btn-xs'; play.dataset.action = 'replay'; play.textContent = '▶ Play intro'; bar.insertBefore(play, $('#pvDevice'));
  bindGlobal(); bindSortable(); renderSteps(); renderWho(); renderBanner();
  const h = (location.hash || '').slice(1);
  showTab(['schedule', 'build', 'library', 'core', 'recipients', 'brand'].includes(h) ? h : 'schedule');
  schedulePreview();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.mode = 'offline'; afterMode(); return; }
  const got = await Promise.all(['db', 'user', 'assets', 'downloads'].map((n) => Promise.resolve().then(() => c.use(n)).catch(() => null)));
  [S.db, S.user, S.assets, S.downloads] = got;
  if (S.user) {
    try { const me = await S.user.me(); S.me = { id: me.id, name: me.name, avatarUrl: me.avatarUrl, isOwner: !!me.isOwner, canEdit: !!me.canEdit }; } catch (e) { /* keep defaults */ }
    try { S.canWrite = await S.user.can('data.write'); } catch (e) { S.canWrite = null; }
  }
  if (!S.db) { S.mode = 'offline'; afterMode(); return; }
  S.mode = 'live'; afterMode(); subscribeAll();
}
init();
})();
</script>
