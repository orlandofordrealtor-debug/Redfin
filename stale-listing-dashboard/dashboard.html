<title>Redfin's Sold Standard</title>

<style>

  --viz-1:#2a78d6; --viz-2:#eb6834; --viz-gray:#b9b2ad; --grid:#e8e2de;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#ee5a66; --accent-ink:#f07b84; --accent-soft:#3a1d20; --ink:#f2edeb;
  --t-watch:#9aa3ae; --t-stale:#e0b254; --t-ultra:#f08a62; --t-extreme:#f06a74;
  --t-watch-soft:#2a2e34; --t-stale-soft:#3a2f14; --t-ultra-soft:#3d2418; --t-extreme-soft:#3f1d20;
  --good:#5fc48f; --good-soft:#1c3327; --info:#7ea9e6; --info-soft:#1d2a3d;
  --viz-1:#3987e5; --viz-2:#d95926; --viz-gray:#5f5753; --grid:#2e2826; --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#151211; --surface:#1f1b1a; --surface-2:#282322; --surface-3:#332c2a; --fg:#f2edeb; --muted:#a69c97; --line:#372f2d; --line-2:#4a403d;
  --accent:#ee5a66; --accent-ink:#f07b84; --accent-soft:#3a1d20; --ink:#f2edeb;

  --viz-1:#3987e5; --viz-2:#d95926; --viz-gray:#5f5753; --grid:#2e2826; --shadow:none; color-scheme:dark; }
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}

.kpi.stale .v{color:var(--t-stale)} .kpi.ultra .v{color:var(--t-ultra)} .kpi.extreme .v{color:var(--t-extreme)} .kpi.watch .v{color:var(--t-watch)}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} .two>*{min-width:0} @media (max-width:900px){.two{grid-template-columns:1fr}}

.badge i{font-style:normal;font-size:10px}
.b-watch{background:var(--t-watch-soft);color:var(--t-watch)} .b-stale{background:var(--t-stale-soft);color:var(--t-stale)} .b-ultra{background:var(--t-ultra-soft);color:var(--t-ultra)} .b-extreme{background:var(--t-extreme-soft);color:var(--t-extreme)} .b-unknown{background:var(--surface-2);color:var(--muted)}
.b-good{background:var(--good-soft);color:var(--good)} .b-info{background:var(--info-soft);color:var(--info)} .b-accent{background:var(--accent-soft);color:var(--accent-ink)} .b-muted{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;font-family:var(--font-display);font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

.dx.high .sev{background:var(--t-extreme)} .dx.med .sev{background:var(--t-stale)} .dx.low .sev{background:var(--t-watch)}
.dx b{font-family:var(--font-display)} .dx p{margin:2px 0 0;font-size:13.5px;color:var(--muted)} .dx .mv{margin-top:4px;font-size:13px}

function assetWorkbook(l,c,A,bands){ const d=studioState(l,c); const rf=l.redfin||{}; const nc=newComps(l); const comps=(rf.bestComps||[]).slice(0,10); const acts=nearby(l,"active").slice().sort((a,b)=>(a.distance??9)-(b.distance??9)); const plan=c.plan||{}; const chosen=(plan.moves&&plan.moves.length?plan.moves:A.rec.slice(0,5)).map(moveById); const secs=resolvedSections(l,c,A,bands).filter(x=>x.on);

function parseCSV(text){ const rows=[]; let row=[],cur="",q=false; for(let i=0;i<text.length;i++){ const ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else if(ch==='"') q=true; else if(ch===","){ row.push(cur); cur=""; } else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=ch; } if(cur!==""||row.length){ row.push(cur); rows.push(row); } const head=rows.shift().map(h=>h.replace(/^﻿/,"").trim()); return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()]))); }
const moneyP=s=>{ if(!s) return null; s=String(s).replace(/[$,]/g,""); let m=1; if(/K$/i.test(s)){m=1000;s=s.slice(0,-1);} else if(/M$/i.test(s)){m=1e6;s=s.slice(0,-1);} const v=parseFloat(s); return isNaN(v)?null:Math.round(v*m); };
const dateP=s=>{ if(!s) return null; const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(!m) return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null; const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; };
async function handleCSV(file){ const out=$("#upload-out"); if(!file) return; const text=await file.text(); let rows; try{ rows=parseCSV(text); }catch(e){ out.innerHTML=`<p style="color:var(--t-extreme)">Could not parse the file.</p>`; return; }
  if(!rows.length||!("Deal Id" in rows[0])){ out.innerHTML=`<p style="color:var(--t-extreme)">This does not look like the Redfin sheet (no "Deal Id" column).</p>`; return; }
  const asOf=todayISO(); const seen=new Set(); const writes=[]; const changes={newStale:[],newUltra:[],newExtreme:[],priceDrops:[],gone:[],added:[]}; const prevTiers=tierCounts(listingsArr());
  for(const r of rows){ const id=r["Deal Id"]; if(!id) continue; seen.add(id); const old=S.listings[id]; const dom=/^\d+$/.test(r["Days On Mkt"])?+r["Days On Mkt"]:null; const cp=moneyP(r["Current Price"]);
    const base={dealId:id,status:r["Deal Status"],listDate:dateP(r["List Date"]),checkInDate:dateP(r["Check In Date"]),expirationDate:dateP(r["Listing Expiration Date"]),agent:r["Agent Name"],address:(r["Street Address"]||"").replace(/,\s*$/,"").trim(),city:r["City"],state:r["State Code"],priceDrop:(r["Price Drop?"]||"").toUpperCase()==="Y",priceDropAmt:moneyP(r["Price Drop Amt"]),lastReductionDate:dateP(r["Last Price Reduction Date"]),dom,dealUrl:r["Deal URL"],suggestedPrice:moneyP(r["Suggested Price Amount"]),originalPrice:moneyP(r["Original Price Amount"]),currentPrice:cp,redfinEstimate:moneyP(r["Current Redfin Estimate"]),predictedClose:moneyP(r["Predicted Close Price Amount"]),hotHome:r["Hot Home Score"]==="1",asOf};
    base.tier=tierOf(dom); base.band=bandOf(cp); base.dataIssues=[]; if(!base.address||base.address==="-") base.dataIssues.push("No address in sheet"); if(!cp) base.dataIssues.push("No current price in sheet");
    base.daysToExpiration=base.expirationDate?daysBetween(asOf,base.expirationDate):null; const est=base.redfinEstimate, pc=base.predictedClose; base.gapToEstimatePct=cp&&est?+((cp-est)/est*100).toFixed(1):null; base.gapToPredictedPct=cp&&pc?+((cp-pc)/pc*100).toFixed(1):null; base.reductionPct=base.originalPrice&&cp&&base.originalPrice>cp?+((base.originalPrice-cp)/base.originalPrice*100).toFixed(1):0;
    const hist=(old&&old.history||[]).filter(h=>h.asOf!==asOf).concat([{asOf,dom,price:cp,estimate:est,tier:base.tier,hot:base.hotHome,priceDrop:base.priceDrop,status:base.status}]).slice(-26);
    const doc={...(old||{}),...base,history:hist,redfin:old&&old.redfin&&old.redfin.ok?{...old.redfin,stale:true}:{ok:false,pending:true}};
    if(old){ if(old.tier==="watch"&&base.tier==="stale") changes.newStale.push(id); if(["watch","stale"].includes(old.tier)&&base.tier==="ultra") changes.newUltra.push(id); if(old.tier!=="extreme"&&base.tier==="extreme") changes.newExtreme.push(id); if(old.currentPrice&&cp&&cp<old.currentPrice) changes.priceDrops.push(id); } else changes.added.push(id);
    writes.push(doc); }
  for(const id of Object.keys(S.listings)) if(!seen.has(id)) changes.gone.push(id);
  out.innerHTML=`<p><b>${rows.length} rows parsed.</b> ${changes.added.length} new, ${changes.gone.length} no longer on the sheet, ${changes.newStale.length} crossed 30 days, ${changes.newUltra.length} crossed 60, ${changes.newExtreme.length} crossed 90, ${changes.priceDrops.length} price drops.</p><div class="pill-row"><button class="btn primary" id="apply-csv">Apply to the dashboard</button></div>`;
  $("#apply-csv").addEventListener("click", async ()=>{ if(!S.db){ toast("Database not available in this view"); return; } $("#apply-csv").disabled=true; let n=0; try{ for(const d of writes){ await S.db.doc("listings/"+d.dealId).set(d); n++; if(n%10===0) $("#apply-csv").textContent=`Saving ${n}/${writes.length}…`; } for(const id of changes.gone){ const d=S.listings[id]; if(d){ await S.db.doc("listings/"+id).set({...d,status:"Removed from sheet",removedAt:asOf}); } } const prev=S.meta||{}; await S.db.doc("meta/current").set({asOf,count:writes.length,prevCount:prev.count||null,prevTiers,prevAsOf:prev.asOf||null,tiers:tierCounts(writes),changes,enrichment:"pending",updatedAt:new Date().toISOString()}); toast("Dashboard updated for "+dstr(asOf)); S.view="overview"; render(); }catch(e){ toast("Save failed: "+(e.message||e.code)); $("#apply-csv").disabled=false; } });
}
/* ============================================================ boot */
function routeFromHash(){ const h=location.hash.replace("#",""); if(h.startsWith("deal-")){ S.sel=h.slice(5); } else if(h&&["overview","listings","agents","market","playbook","upload"].includes(h)) S.view=h; }
async function boot(){
  try{ const a=JSON.parse(localStorage.getItem("slcc-assump")||"null"); if(a) Object.assign(S.a,a); }catch(_){}
  routeFromHash(); window.addEventListener("hashchange",()=>{ routeFromHash(); render(); });
  const hot=window.claude&&window.claude.hot; if(hot&&hot.snapshot) hot.snapshot(()=>({view:S.view,sel:S.sel,f:S.f,ptab:S.ptab}));
  if(hot&&hot.data){ Object.assign(S,{view:hot.data.view||S.view,sel:hot.data.sel||S.sel,f:hot.data.f||S.f,ptab:hot.data.ptab||S.ptab}); }
  render();
  const [db,user,sample,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample"),claude.use("downloads")]);
  S.db=db; S.user=user; S.sample=sample; S.downloads=downloads;
  if(user){ try{ S.me=await user.me(); S.canWrite=await user.can("data.write"); }catch(_){} }
  if(sample){ try{ const lim=await sample.limits(); S.imagesOk=!!(lim&&lim.images); }catch(_){} }
  if(!db){ S.loaded=true; $("#asof").textContent="Database unavailable in this view"; render(); return; }
  let first=true; const ready=()=>{ if(first){ first=false; S.loaded=true; } render(); };
  db.collection("listings").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&x.dealId&&x.status!=="Removed from sheet") next[x.dealId]=x; }); const mort={}; for(const k in S.listings) if(S.listings[k]._mortgage) mort[k]=S.listings[k]._mortgage; S.listings=next; for(const k in mort) if(S.listings[k]) S.listings[k]._mortgage=mort[k]; ready(); }, e=>{ S.loaded=true; $("#asof").textContent="Could not load listings"; render(); });
  db.collection("coaching").onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ const x=d.data(); if(x) next[d.id]=x; }); S.coaching=next; for(const k in next){ if(S.listings[k]&&next[k].plan&&next[k].plan.mortgage) S.listings[k]._mortgage=next[k].plan.mortgage; } if(S.loaded) render(); }, ()=>{});
  db.doc("meta/current").onSnapshot(s=>{ S.meta=s.exists?s.data():null; $("#asof").textContent=S.meta?`${APP_TAG} · Week of ${dstr(S.meta.asOf)} · ${S.meta.count||""} listings${S.meta.enrichment==="pending"?" · enrichment pending":""}`:APP_TAG+" · No snapshot yet"; if(S.loaded) render(); }, ()=>{});
  db.doc("market/current").onSnapshot(s=>{ S.market=s.exists?s.data():null; if(S.market&&S.market.rates&&S.market.rates.rate30&&!localStorage.getItem("slcc-assump")) S.a.rate=S.market.rates.rate30; if(S.loaded) render(); }, ()=>{});
  db.doc("playbook/current").onSnapshot(s=>{ S.playbook=s.exists?s.data():null; if(S.loaded) render(); }, ()=>{});
  db.collection("weeks").onSnapshot(snap=>{ S.weeks=snap.docs.map(d=>d.data()).filter(w=>w&&w.asOf).sort((a,b)=>a.asOf<b.asOf?-1:1); if(S.loaded) render(); }, ()=>{});
  setTimeout(()=>{ if(!S.loaded){ S.loaded=true; render(); } }, 12000);
}
boot();
</script>
